name: aevumstack-local

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    restart: "no"
    environment:
      POSTGRES_DB: aevumstack_dev
      POSTGRES_USER: aevumstack
      POSTGRES_PASSWORD: "${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in .env.local-runtime}"
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "aevumstack", "-d", "aevumstack_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: "no"
    command:
      - --listen
      - 0.0.0.0:8025
      - --smtp
      - 0.0.0.0:1025
      - --disable-version-check
      - --smtp-disable-rdns
      - --smtp-allowed-recipients
      - '^enquiries@aevumstack[.]invalid$'
    ports:
      - "127.0.0.1:${LOCAL_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${LOCAL_MAILPIT_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz", "--listen", "127.0.0.1:8025"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
